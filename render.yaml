services:
  - type: web
    name: uob-bjj-webapp
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: uob-bjj-db
          property: connectionString
      - key: DEMO_MODE
        value: "0"
      - key: FLASK_DEBUG
        value: "0"

databases:
  - name: uob-bjj-db
    plan: free
    region: frankfurt
    databaseName: uob_bjj
    user: uob_bjj
    version: "16"
