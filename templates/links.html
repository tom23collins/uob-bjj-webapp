<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UoB BJJ · Links</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
  </head>
  <body data-bs-theme="dark">
    <main class="links-page">
      <div class="links-shell text-center">
        <img src="{{ url_for('static', filename='logo.jpg') }}" alt="UoB Brazilian Jiu Jitsu logo" class="links-logo rounded-circle">
        <h1 class="mt-4 mb-1">UoB Brazilian Jiu Jitsu</h1>
        <p class="links-handle mb-2">@uob_bjj</p>
        <p class="mb-4">Train hard. Learn together. Everyone is welcome.</p>

        <div class="d-grid gap-3">
          <a class="links-button" href="{{ instagram_url }}" target="_blank" rel="noopener noreferrer">
            <i class="bi bi-instagram"></i><span>Follow us on Instagram</span><i class="bi bi-arrow-up-right"></i>
          </a>
          <a class="links-button" href="{{ whatsapp_url }}" target="_blank" rel="noopener noreferrer">
            <i class="bi bi-whatsapp"></i><span>Join our WhatsApp community</span><i class="bi bi-arrow-up-right"></i>
          </a>
          <a class="links-button" href="{{ url_for('index') }}">
            <i class="bi bi-calendar-check"></i><span>Sign up for a taster session</span><i class="bi bi-arrow-right"></i>
          </a>
          <a class="links-button" href="{{ membership_url }}" target="_blank" rel="noopener noreferrer">
            <i class="bi bi-person-plus"></i><span>Buy your club membership</span><i class="bi bi-arrow-up-right"></i>
          </a>
        </div>

        <p class="mt-4 mb-0 small text-muted">University of Birmingham Brazilian Jiu Jitsu</p>
      </div>
    </main>
  </body>
</html>
